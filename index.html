<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#1B1650"><link rel="icon" type="image/png" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<title>Carnet — Gestion d’école</title>
<style>
:root{--bg:#F3F5F8;--card:#fff;--ink:#14213D;--mut:#5B6678;--acc:#14213D;--on:#fff;--line:#DDE3EC;--margin:#C8102E;--ok:#1F8A5B;--err:#B42318;--serif:"Iowan Old Style","Noto Serif",Georgia,serif}
@media(prefers-color-scheme:dark){:root{--bg:#0E1626;--card:#16213A;--ink:#EAF0FB;--mut:#9FB0C9;--acc:#8FB4FF;--on:#0E1626;--line:#27355A;--margin:#FF6B7F;--ok:#4FD1A0;--err:#FF9A8F}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:780px;margin:0 auto;padding:8px 16px 48px 30px;position:relative;min-height:100vh}
main::before{content:"";position:absolute;left:15px;top:0;bottom:0;width:2px;background:var(--margin);opacity:.5}
h1{font:700 28px/1.2 var(--serif);margin:14px 0 2px}h2{font:700 19px/1.3 var(--serif);margin:20px 0 8px}
.hd{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0 12px;border-bottom:1px solid var(--line)}
.brand{font:700 24px var(--serif)}.hd .mut{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin:10px 0}
input,select,button,textarea{font:inherit;width:100%;min-height:44px;padding:10px 12px;margin:4px 0;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
button{background:var(--acc);color:var(--on);border:0;font-weight:600;cursor:pointer}button.ghost{background:none;color:var(--ink);border:1px solid var(--line)}button.sm{width:auto;min-height:36px;padding:6px 14px}
:focus-visible{outline:3px solid var(--margin);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1 1 140px}
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:12px;scrollbar-width:none}
.tabs button{width:auto;white-space:nowrap;background:none;color:var(--mut);border:0;border-bottom:3px solid transparent;border-radius:0;margin:0;padding:10px 12px}
.tabs button:not(.ghost){color:var(--ink);border-bottom-color:var(--margin)}
.mut{color:var(--mut);font-size:14px}.err{color:var(--err);min-height:1.2em}.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px;margin:12px 0}
.stat{display:flex;flex-direction:column;align-items:flex-start;text-align:left;width:auto;min-height:0;margin:0;padding:14px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;font-weight:500}
.stat .n{font:700 36px/1 var(--serif)}.stat .l{color:var(--mut);font-size:14px;margin-top:6px}.stat .s{color:var(--margin);font-size:13px;font-weight:600;margin-top:2px}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--ok)}
.li{display:flex;gap:12px;padding:9px 0;border-top:1px solid var(--line)}.li:first-of-type{border-top:0}.li b{min-width:92px;font-variant-numeric:tabular-nums}
@media(prefers-reduced-motion:no-preference){.card,.stat{transition:border-color .15s}.stat:hover{border-color:var(--margin)}}
@media print{.hd,.tabs,button,select{display:none}main::before{display:none}}

.bar-top{display:flex;align-items:center;gap:2px;padding:6px 0;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
.bar-top .pt{flex:1;font:700 19px var(--serif);padding-left:6px}.ib{width:44px;height:44px;background:none;color:var(--ink);padding:0;display:grid;place-items:center;margin:0;position:relative}
.dot{position:absolute;top:9px;right:10px;width:9px;height:9px;border-radius:50%;background:var(--margin)}
.ov{position:fixed;inset:0;background:rgba(10,8,40,.5);opacity:0;pointer-events:none;z-index:20}.ov.open{opacity:1;pointer-events:auto}
.dr{position:fixed;left:0;top:0;bottom:0;width:min(310px,84vw);display:flex;flex-direction:column;background:linear-gradient(165deg,#2b2178,#1b1650 55%,#18123f);color:#fff;transform:translateX(-105%);z-index:21;overflow:hidden}.dr.open{transform:none}
@media(prefers-reduced-motion:no-preference){.dr{transition:transform .22s}.ov{transition:opacity .22s}}
.dr .bd{padding:22px 20px 12px}.dr .bd b{font:700 32px var(--serif);display:flex;align-items:center;gap:12px}.dr .bd p{margin:10px 0 0;color:#C9C3F5;font-size:15px;line-height:1.35}
.dr .it{flex:1;overflow-y:auto;padding:6px 12px}
.ni{display:flex;gap:14px;align-items:center;width:100%;background:none;color:#D9D4FF;border:0;border-radius:12px;padding:10px 14px;margin:2px 0;font-size:17px;text-align:left;min-height:48px}.ni.on{background:#fff;color:#1B1650;font-weight:600}.ni .bg{margin-left:auto;background:#FF6B7F;color:#fff;border-radius:10px;padding:0 8px;font-size:13px;font-weight:700}
.uc{background:rgba(255,255,255,.1);border-radius:14px;padding:12px;margin:10px 12px 14px}.uc .u{display:flex;gap:12px;align-items:center;margin-bottom:10px}.uc .av{width:44px;height:44px;flex:none;border-radius:50%;background:#6C4FD8;display:grid;place-items:center;font-weight:700}.uc small{display:block;color:#C9C3F5}
.out{display:flex;gap:8px;justify-content:center;align-items:center;background:none;color:#fff;border:1px solid rgba(255,255,255,.3);margin:0}
.seg{display:flex;gap:6px;margin:12px 0}.seg button{flex:1;width:auto}
.bub{max-width:85%;padding:8px 12px;border-radius:14px;margin:6px 0;background:var(--card);border:1px solid var(--line);white-space:pre-wrap}.bub.me{margin-left:auto;background:var(--acc);color:var(--on);border-color:transparent}.bub small{display:block;opacity:.7;font-size:12px}
@media print{.bar-top,.dr,.ov{display:none}}

<script>
const SB=supabase.createClient("https://lwdjfvulsixevexpiexg.supabase.co","eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx3ZGpmdnVsc2l4ZXZleHBpZXhnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM1NDI4OTksImV4cCI6MjEwOTExODg5OX0.gds7lS25_3E_MmXGkSB76jYFKJrmeXM9j8NIzdY_0Ow");
const app=document.getElementById('app');

const ROLES={parent:'Parent',student:'Élève',teacher:'Professeur',admin:'Direction',comptable:'Comptable',surveillant:'Surveillant'};
const mail=v=>{v=v.trim().toLowerCase();return v.includes('@')?v:v+'@carnet-ecole.gn'};
let me=null,tab='dash',mode='in',CFG={school_name:'',school_year:''},ISP=false,PS={price_monthly:0,price_annual:0,payment_instructions:''};

function authView(msg=''){
 const up=mode==='up';
 app.innerHTML=`<h1>Carnet</h1><p class="mut">Gestion d’école</p><div class="card">
 <div class="row"><button class="${up?'ghost':''}" onclick="mode='in';authView()">Connexion</button><button class="${up?'':'ghost'}" onclick="mode='up';authView()">Créer un compte</button></div>
 ${up?`<input id="nm" placeholder="Nom complet" autocomplete="name"><select id="rr" onchange="const a=this.value==='admin';document.getElementById('sc').style.display=a?'none':'block';document.getElementById('sno').style.display=a?'block':'none'"><option value="parent">Je suis parent</option><option value="student">Je suis élève</option><option value="teacher">Je suis professeur</option><option value="admin">Je dirige une école (créer mon école)</option></select><input id="ph" placeholder="Téléphone" inputmode="tel">`:''}
 <input id="id" placeholder="E-mail ou identifiant" autocomplete="username" autocapitalize="none">
 <input id="pw" type="password" placeholder="Mot de passe${up?' (8 caractères min.)':''}" autocomplete="${up?'new-password':'current-password'}">
 ${up?`<input id="sc" placeholder="Code de l’école (donné par la direction)" autocapitalize="characters"><input id="sno" style="display:none" placeholder="Nom de votre école">`:''}
 <p class="err" id="er">${esc(msg)}</p><button id="go">${up?'Créer mon compte':'Se connecter'}</button></div>`;
 document.getElementById('go').onclick=async e=>{
  const g=s=>document.getElementById(s)?.value||'',er=document.getElementById('er');
  const email=mail(g('id')),password=g('pw');er.textContent='';
  if(!g('id')||!password)return er.textContent='Renseignez l’identifiant et le mot de passe.';
  e.target.disabled=true;let r;
  if(up){
   if(password.length<8){e.target.disabled=false;return er.textContent='Mot de passe : 8 caractères minimum.'}
   if(g('rr')==='admin'?g('sno').trim().length<3:!g('sc').trim()){e.target.disabled=false;return er.textContent=g('rr')==='admin'?'Indiquez le nom de votre école.':'Saisissez le code de votre école.'}
   if(g('nm').trim().length<3){e.target.disabled=false;return er.textContent='Indiquez votre nom complet.'}
   r=await SB.auth.signUp({email,password,options:{data:{full_name:g('nm').trim(),requested_role:g('rr'),phone:g('ph').trim(),school_code:g('rr')==='admin'?'':g('sc').trim(),school_name:g('rr')==='admin'?g('sno').trim():''}}});
   if(!r.error)r=await SB.auth.signInWithPassword({email,password});
  }else r=await SB.auth.signInWithPassword({email,password});
  e.target.disabled=false;
  if(r.error)return er.textContent=r.error.message.includes('Invalid login')?'Identifiant ou mot de passe incorrect.':r.error.message.includes('Database error')?(up&&g('rr')!=='admin'?'Code école invalide, ou école non activée. Demandez le code à la direction de votre école.':'Impossible de créer le compte : vérifiez les informations (cet identifiant existe peut-être déjà).'):r.error.message;
  load();
 };
}
async function load(){
 const{data:{user}}=await SB.auth.getUser();if(!user)return authView();
 const{data,error}=await SB.from('profiles').select('*').eq('id',user.id).single();
 if(error||!data){await SB.auth.signOut();return authView('Compte introuvable.')}
 me=data;{const c=await SB.from('schools').select('*').maybeSingle();if(c.data)CFG={id:c.data.id,school_name:c.data.name,school_year:c.data.year,join_code:c.data.join_code,status:c.data.status,paid_until:c.data.paid_until,plan:c.data.plan};ISP=(await SB.rpc('is_platform')).data===true;const ps=await SB.from('platform_settings').select('*').maybeSingle();if(ps.data)PS=ps.data}render();
}
const out=()=>SB.auth.signOut().then(()=>{me=null;mode='in';authView()});
const head=()=>`<header class="hd"><div><span class="brand">Carnet</span><span class="mut">${esc(me.full_name)} · ${ROLES[me.role]||'En attente'}</span></div><button class="ghost sm" onclick="out()">Quitter</button></header>`;

const IC={"heart":"M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z","globe":"M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20zM2 12h20M12 2a15 15 0 0 1 0 20 15 15 0 0 1 0-20","sliders":"M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6","menu": "M4 6h16M4 12h16M4 18h16", "help": "M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20zM9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3M12 17h.01", "bell": "M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.9 1.9 0 0 0 3.4 0", "cap": "M22 10 12 5 2 10l10 5zM6 12v5c0 1.5 2.7 3 6 3s6-1.5 6-3v-5M22 10v6", "out": "M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4m7 14 5-5-5-5M21 12H9", "home": "M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z", "users": "M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8M22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8", "uplus": "M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8M19 8v6M22 11h-6", "card": "M5 3h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zM12 12a3 3 0 1 0 0-6 3 3 0 0 0 0 6M7 20c.5-2.5 2.5-4 5-4s4.5 1.5 5 4", "layers": "m12 2 10 5-10 5L2 7zM2 17l10 5 10-5M2 12l10 5 10-5", "cal": "M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z", "pen": "M13.4 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7.4M2 6h4M2 10h4M2 14h4M2 18h4M21.4 5.6a2 2 0 0 0-3-3L11 10l-1 4 4-1z", "file": "M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zM14 2v6h6M8 13h8M8 17h8M8 9h2", "book": "M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2zM22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z", "check": "M9 2h6v4H9zM16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2m1 10 2 2 4-4", "wallet": "M19 7V5a2 2 0 0 0-2-2H5a2 2 0 0 0 0 4h14a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5M16 13h2", "msg": "M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z", "mega": "m3 11 18-5v12L3 13zM11.6 16.8a3 3 0 1 1-5.8-1.6"};
const ic=(k,z=22)=>`<svg width="${z}" height="${z}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${IC[k]}"/></svg>`;
const D=['dash','Tableau de bord','home'],TT_=['ttb','Emploi du temps','cal'],BU=['bul','Bulletins','file'],HW_=['hw','Devoirs','book'],AR_=['ar','Absences & retards','check'],FE_=['fee','Frais & paiements','wallet'],MS=['msg','Messagerie','msg'],AN=['ann','Annonces','mega'];
const NAV={admin:[D,['req','Demandes d’inscription','uplus'],['stu','Élèves','users'],['par','Parents','heart'],['tch','Professeurs','card'],['cm','Classes & matières','layers'],TT_,BU,HW_,AR_,FE_,MS,AN,['abo','Abonnement','card'],['set','Paramètres','sliders']],
 teacher:[D,['stu','Mes élèves','users'],TT_,['not','Notes','pen'],BU,HW_,AR_,MS,AN],
 comptable:[D,['stu','Élèves','users'],FE_,MS,AN],
 surveillant:[D,['stu','Élèves','users'],AR_,MS,AN],
 student:[D,['stu','Ma fiche','users'],TT_,BU,HW_,AR_,FE_,MS,AN],
 parent:[D,['stu','Mes enfants','users'],TT_,BU,HW_,AR_,FE_,MS,AN]};
const drawer=o=>{document.getElementById('dr').classList.toggle('open',!!o);document.getElementById('ov').classList.toggle('open',!!o)};
function render(){
 if(me.role==='pending'){app.innerHTML=head()+`<div class="card"><h2>Compte en attente</h2><p>Votre demande est enregistrée. La direction doit la valider et vous rattacher à votre fiche. Revenez plus tard.</p><button onclick="load()">Actualiser</button></div>`;return}
 const st=sstate();
 if(st==='blocked'&&!ISP){app.innerHTML=head()+'<div id="body"></div>';if(me.role==='admin')showPlan();else B().innerHTML='<div class="card"><h2>École non active</h2><p>L’abonnement de votre école n’est pas actif. Contactez la direction de votre école.</p></div>';return}
 const banner=st==='grace'?`<div class="card" style="border-color:var(--margin)"><b>Abonnement expiré</b> : lecture seule.${me.role==='admin'?` <button class="ghost sm" onclick="go('abo')">Renouveler</button>`:' Prévenez la direction.'}</div>`:'';
 const N=[...NAV[me.role],...(ISP?[['plat','Plateforme','globe']]:[])];if(!N.some(x=>x[0]===tab))tab=N[0][0];
 const cur=N.find(x=>x[0]===tab),ini=me.full_name.split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
 app.innerHTML=`<div class="bar-top"><button class="ib" onclick="drawer(1)" aria-label="Ouvrir le menu">${ic('menu')}</button><b class="pt">${esc(cur[1])}</b><button class="ib" onclick="alert('Besoin d’aide ? Écrivez à la direction depuis la Messagerie.')" aria-label="Aide">${ic('help')}</button><button class="ib" onclick="go('ann')" aria-label="Annonces">${ic('bell')}<i class="dot" id="dot" hidden></i></button></div>
 <div id="ov" class="ov" onclick="drawer(0)"></div><nav id="dr" class="dr" aria-label="Menu principal"><div class="bd"><b>${ic('cap',30)}Carnet</b><p>${esc(CFG.school_name||'École à nommer')}${CFG.school_year?'<br>Année '+esc(CFG.school_year):''}</p></div>
 <div class="it">${N.map(([k,l,i])=>`<button class="ni ${k===tab?'on':''}" onclick="go('${k}')">${ic(i)}<span>${esc(l)}</span>${k==='req'?'<span class="bg" id="pc" hidden></span>':''}</button>`).join('')}</div>
 <div class="uc"><div class="u"><span class="av">${esc(ini)}</span><div><b>${esc(me.full_name)}</b><small>${ROLES[me.role]}</small></div></div><button class="out" onclick="out()">${ic('out',20)}Changer de compte</button></div></nav>${banner}<div id="body"></div>`;
 ({dash:showDash,req:showReq,stu:()=>showStudents(me.role==='admin'),tch:showTeachers,cm:showCM,ttb:showTT,not:showNotes,bul:showBulletin,hw:showHW,ar:showAR,fee:showFees,msg:showMsg,ann:showAnn,set:showSettings,abo:showPlan,plat:showPlatform,par:showParents})[tab]();
 SB.from('announcements').select('created_at').order('created_at',{ascending:false}).limit(1).then(({data})=>{const t=data?.[0]?.created_at;let sn=0;try{sn=localStorage.getItem('annSeen')||0}catch{}if(t&&new Date(t)>new Date(sn))document.getElementById('dot')?.removeAttribute('hidden')});
 if(me.role==='admin')SB.from('profiles').select('*',{count:'exact',head:true}).eq('role','pending').then(r=>{const e=document.getElementById('pc');if(e&&r.count){e.textContent=r.count;e.hidden=false}});
}
const B=()=>document.getElementById('inner')||document.getElementById('body'),opt=(a,f)=>a.map(x=>`<option value="${esc(x.id)}">${esc(f(x))}</option>`).join('');
const nm=x=>`${x.first_name} ${x.last_name}`;

/* Demandes (direction) */
let PEND=[],PPL={};
async function showReq(){
 B().innerHTML='<p class="mut">Chargement…</p>';
 const[p,t,g,s]=await Promise.all([SB.from('profiles').select('*').eq('role','pending').order('created_at'),SB.from('teachers').select('*'),SB.from('guardians').select('*'),SB.from('students').select('*')]);
 PEND=p.data||[];PPL={teacher:t.data||[],parent:g.data||[],student:s.data||[]};
 B().innerHTML=PEND.length?PEND.map(r=>`<div class="card" id="r${r.id}"><b>${esc(r.full_name)}</b><div class="mut">Demande : ${ROLES[r.requested_role]||'—'} · ${esc(r.phone||'sans téléphone')}</div>
 <select class="role" onchange="fillP('${r.id}')">${['parent','student','teacher','comptable','surveillant'].map(k=>`<option value="${k}" ${k===r.requested_role?'selected':''}>${ROLES[k]}</option>`).join('')}</select><select class="pid"></select>
 <button onclick="approve('${r.id}')">Valider</button></div>`).join(''):'<p class="mut">Aucune demande en attente.</p>';
 PEND.forEach(r=>fillP(r.id));
}
function fillP(id){const c=document.getElementById('r'+id),role=c.querySelector('.role').value;
 if(role==='comptable'||role==='surveillant'){c.querySelector('.pid').innerHTML='<option value="staff">Aucune fiche nécessaire</option>';return}
 c.querySelector('.pid').innerHTML=(role==='student'?'<option value="">Choisir l’élève existant…</option>':'<option value="new">➕ Créer une nouvelle fiche</option>')+opt(PPL[role],nm)}
async function approve(id){
 const c=document.getElementById('r'+id),role=c.querySelector('.role').value;let pid=c.querySelector('.pid').value;
 if(!pid)return alert('Choisissez la fiche de l’élève.');if(pid==='staff')pid=null;
 const p=PEND.find(x=>x.id===id);
 if(pid==='new'){const[f,...l]=p.full_name.trim().split(/\s+/);
  const{data,error}=await SB.from(role==='teacher'?'teachers':'guardians').insert({first_name:f,last_name:l.join(' ')||f,phone:p.phone||null}).select('id').single();
  if(error)return alert(error.message);pid=data.id}
 const{error}=await SB.from('profiles').update({role,person_id:pid}).eq('id',id);
 error?alert(error.message):showReq();
}

/* Classes */

 const[c,l,t]=await Promise.all([SB.from('classes').select('*,levels(name),teachers(first_name,last_name)').order('name'),SB.from('levels').select('*').order('position'),SB.from('teachers').select('*')]);

async function gradeSheet(cid,eid){
 const[s,g]=await Promise.all([SB.from('students').select('id,first_name,last_name').eq('class_id',cid).order('last_name'),SB.from('grades').select('*').eq('assessment_id',eid)]);

async function saveGrades(eid){

 let r={};if(rows.length)r=await SB.from('grades').upsert(rows);
 if(!r.error&&del.length)r=await SB.from('grades').delete().eq('assessment_id',eid).in('student_id',del);

let BS={s:null,t:1};
async function showBulletin(){
 const{data:S}=await SB.from('students').select('id,first_name,last_name,classes(name)').order('last_name');
 if(!S?.length){B().innerHTML='<p class="mut">Aucun élève à afficher.</p>';return}

 <div class="card"><div class="mut">${esc(CFG.school_name)}${CFG.school_year?' · Année '+esc(CFG.school_year):''}</div><h2>Bulletin — ${esc(nm(st))}</h2><div class="mut">${esc(st.classes?.name||'Sans classe')} · Trimestre ${BS.t}</div>

 <p><b>Moyenne générale : ${moy.toFixed(2)} / 20</b> · ${ap(moy)}${rk?` · Rang : ${rk.pos} sur ${rk.total}`:''}</p><button class="ghost" onclick="window.print()">Imprimer</button>`:'<p class="mut">Aucune note pour ce trimestre.</p>'}</div>`;

/* Frais de scolarité */
const gnf=n=>new Intl.NumberFormat('fr-FR').format(n||0)+' GNF';
const PM={especes:'Espèces',mobile_money:'Mobile money',virement:'Virement',cheque:'Chèque'};
let FE={s:null};
async function showFees(){
 const adm=['admin','comptable'].includes(me.role),isA=me.role==='admin';
 const[S,P,D,L]=await Promise.all([SB.from('students').select('id,first_name,last_name,classes(name,levels(fee))').order('last_name'),SB.from('payments').select('*').order('paid_on',{ascending:false}),SB.from('fee_discounts').select('*'),isA?SB.from('levels').select('*').order('position'):{data:[]}]);
 const st=S.data||[],pay=P.data||[],dc=Object.fromEntries((D.data||[]).map(x=>[x.student_id,x.amount]));
 if(!st.length){B().innerHTML='<p class="mut">Aucun élève à afficher.</p>';return}
 const info=x=>{const due=Math.max(0,(x.classes?.levels?.fee||0)-(dc[x.id]||0)),paid=pay.filter(p=>p.student_id===x.id).reduce((a,p)=>a+p.amount,0);return{due,paid,rest:due-paid}};
 if(!st.some(x=>x.id===FE.s))FE.s=st[0].id;
 FEI=Object.fromEntries(st.map(x=>[x.id,{n:nm(x),r:info(x).rest}]));
 const cur=st.find(x=>x.id===FE.s),ci=info(cur),today=new Date().toISOString().slice(0,10);
 const sel=`<select onchange="FE.s=this.value;showFees()">${st.map(x=>`<option value="${x.id}" ${x.id===FE.s?'selected':''}>${esc(nm(x))}</option>`).join('')}</select>`;
 const detail=`<div class="card"><h2>${esc(nm(cur))}</h2><div class="mut">${esc(cur.classes?.name||'Sans classe')}</div><p>À payer : <b>${gnf(ci.due)}</b>${dc[cur.id]?` (remise ${gnf(dc[cur.id])})`:''}<br>Payé : <b>${gnf(ci.paid)}</b><br>Reste : <b style="color:${ci.rest>0?'var(--err)':'inherit'}">${gnf(Math.max(0,ci.rest))}</b>${ci.rest<0?' · trop-perçu '+gnf(-ci.rest):''}</p>${adm?`<button class="ghost" onclick="setDisc('${cur.id}',${dc[cur.id]||0})">Définir une remise</button>`:''}</div>`+
  pay.filter(p=>p.student_id===cur.id).map(p=>`<div class="card"><b>${gnf(p.amount)}</b> · ${esc(PM[p.method])}<div class="mut">${esc(new Date(p.paid_on+'T00:00').toLocaleDateString('fr-FR'))}${p.reference?' · réf. '+esc(p.reference):''}</div>${adm?`<button class="ghost" onclick="delPay('${p.id}')">Annuler ce paiement</button>`:''}</div>`).join('');
 if(!adm){B().innerHTML=sel+detail+await declareHtml(cur);return}
 const late=st.map(x=>({x,...info(x)})).filter(r=>r.rest>0).sort((a,b)=>b.rest-a.rest).slice(0,30);
 B().innerHTML=(isA?`<div class="card"><h2>Tarifs annuels par niveau</h2>${(L.data||[]).map(l=>`<div class="row"><span style="flex:1 1 140px;align-self:center">${esc(l.name)}</span><input id="lf${l.id}" type="number" min="0" value="${l.fee}"><button onclick="saveFee('${l.id}')">OK</button></div>`).join('')}</div>`:'')+
 sel+detail+`<div class="card"><h2>Encaisser un paiement</h2><div class="row"><input id="pa" type="number" min="1" placeholder="Montant (GNF)"><select id="pm">${Object.entries(PM).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div><div class="row"><input id="pr" placeholder="Référence (optionnel)"><input id="pd" type="date" value="${today}"></div><p class="err" id="pe"></p><button onclick="addPay()">Encaisser</button></div>`+
 `<h2>Plus gros soldes à payer</h2>`+(late.map(r=>`<div class="card" onclick="FE.s='${r.x.id}';showFees()"><b>${esc(nm(r.x))}</b> · ${esc(r.x.classes?.name||'—')}<div class="mut">Reste ${gnf(r.rest)} sur ${gnf(r.due)}</div><button class="ghost sm" onclick="event.stopPropagation();remind('${r.x.id}')">Relancer sur WhatsApp</button></div>`).join('')||'<p class="mut">Aucun solde en attente.</p>')+await reviewHtml(isA);
}
async function saveFee(id){const v=+document.getElementById('lf'+id).value;if(!(v>=0))return;const{error}=await SB.from('levels').update({fee:Math.round(v)}).eq('id',id);error?alert(error.message):showFees()}
async function setDisc(sid,cur){const v=prompt('Remise en GNF (0 pour retirer)',cur);if(v===null)return;const n=Math.round(+v);if(!(n>=0))return alert('Montant invalide.');
 const{error}=n?await SB.from('fee_discounts').upsert({student_id:sid,amount:n}):await SB.from('fee_discounts').delete().eq('student_id',sid);error?alert(error.message):showFees()}
async function addPay(){const g=i=>document.getElementById(i).value.trim(),a=Math.round(+g('pa'));
 if(!(a>0))return document.getElementById('pe').textContent='Indiquez un montant valide.';
 const{error}=await SB.from('payments').insert({student_id:FE.s,amount:a,method:g('pm'),reference:g('pr')||null,paid_on:g('pd')||undefined});
 error?document.getElementById('pe').textContent=error.message:showFees()}
async function delPay(id){if(!confirm('Annuler définitivement ce paiement ?'))return;const{error}=await SB.from('payments').delete().eq('id',id);error?alert(error.message):showFees()}

 const[an,sl]=await Promise.all([SB.from('announcements').select('title,body,created_at').order('created_at',{ascending:false}).limit(2),SB.from('timetable_slots').select('start_time,end_time,room,assignments(teacher_id,classes(name),subjects(name))').eq('weekday',wd).order('start_time')]);
 let top='',hw='';
 if(adm){
  const[ns,nc,nt,np,ab,S,P,D]=await Promise.all([cnt('students'),cnt('classes'),cnt('teachers'),cnt('profiles',q=>q.eq('role','pending')),cnt('attendance',q=>q.eq('day',today).eq('status','absent')),SB.from('students').select('id,classes(levels(fee))'),SB.from('payments').select('amount'),SB.from('fee_discounts').select('amount')]);
  const exp=Math.max(0,(S.data||[]).reduce((t,x)=>t+(x.classes?.levels?.fee||0),0)-sumA(D.data)),got=sumA(P.data),pc=exp?Math.min(100,Math.round(got*100/exp)):0;
  top=setupCard()+`<div class="grid">${stat('Élèves',ns,'stu')}${stat('Classes',nc,'cm')}${stat('Professeurs',nt,'tch')}${stat('Demandes d’inscription',np,'req',np?'À valider':'')}${stat('Absents aujourd’hui',ab,'ar')}</div><div class="card"><div class="top"><b>Frais encaissés</b><b>${pc} %</b></div><div class="bar"><i style="width:${pc}%"></i></div><div class="mut">${gnf(got)} sur ${gnf(exp)} attendus</div></div>`;
 }else{
  const[H,AB,S,P,D]=await Promise.all([SB.from('homework').select('title,due_on,assignments(classes(name),subjects(name))').gte('due_on',today).order('due_on').limit(4),tea?{data:[]}:SB.from('attendance').select('status,justified'),tea?{data:[]}:SB.from('students').select('id,classes(levels(fee))'),tea?{data:[]}:SB.from('payments').select('amount'),tea?{data:[]}:SB.from('fee_discounts').select('amount')]);
  const nj=(AB.data||[]).filter(x=>x.status==='absent'&&!x.justified).length,rest=Math.max(0,(S.data||[]).reduce((t,x)=>t+(x.classes?.levels?.fee||0),0)-sumA(D.data)-sumA(P.data));
  top=`<div class="grid">${stat('Devoirs à venir',(H.data||[]).length,'hw')}${tea?'':stat('Absences non justifiées',nj,'ar')}${tea?'':stat('Reste à payer',gnf(rest).replace(' GNF',''),'fee','GNF')}</div>`;
  hw=`<h2>Prochains devoirs</h2>`+((H.data||[]).map(x=>`<div class="card"><b>${esc(x.title)}</b><div class="mut">${esc(x.assignments.classes.name)} — ${esc(x.assignments.subjects.name)} · pour le ${esc(dfr(x.due_on))}</div></div>`).join('')||'<p class="mut">Aucun devoir à rendre.</p>');
 }
 const slots=(sl.data||[]).filter(x=>!tea||x.assignments.teacher_id===me.person_id);
 const day=`<h2>Aujourd’hui, ${esc(now.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'}))}</h2><div class="card">${wd===7?'<span class="mut">Pas de cours le dimanche.</span>':slots.map(x=>`<div class="li"><b>${t5(x.start_time)}–${t5(x.end_time)}</b><div>${esc(x.assignments.subjects.name)}<div class="mut">${esc(x.assignments.classes.name)}${x.room?' · '+esc(x.room):''}</div></div></div>`).join('')||'<span class="mut">Aucun cours programmé aujourd’hui.</span>'}</div>`;
 const ann=`<h2>Annonces</h2>`+((an.data||[]).map(x=>`<div class="card"><b>${esc(x.title)}</b><div class="mut">${esc(new Date(x.created_at).toLocaleDateString('fr-FR'))}</div><p style="margin:6px 0;white-space:pre-wrap">${esc(x.body.length>220?x.body.slice(0,220)+'…':x.body)}</p></div>`).join('')||'<p class="mut">Aucune annonce.</p>');
 B().innerHTML=`<h1>Bonjour, ${esc(me.full_name.split(' ')[0])}</h1>${top}${day}${hw}${ann}`;

const sstate=()=>{if(CFG.status!=='active')return'blocked';if(!CFG.paid_until)return'active';const d=Math.floor((new Date(CFG.paid_until+'T23:59:59')-new Date())/864e5);return d>=0?'active':d>=-15?'grace':'blocked'};

 const{data:P}=await SB.from('school_payments').select('*').order('created_at',{ascending:false});

 `<div class="card"><h2>Tarifs et moyens de paiement</h2><div class="row"><input id="tm" type="number" min="0" placeholder="Prix mensuel (GNF)" value="${PS.price_monthly||''}"><input id="ta2" type="number" min="0" placeholder="Prix annuel (GNF)" value="${PS.price_annual||''}"></div><textarea id="ti" rows="4" maxlength="1000">${esc(PS.payment_instructions)}</textarea><p class="err" id="tx2"></p><button onclick="savePS()">Enregistrer</button></div>`;
}
async function revPay(id,ok){const n=ok?null:prompt('Motif du rejet (optionnel)');if(!ok&&n===null)return;const{error}=await SB.rpc('review_school_payment',{pid:id,ok,rnote:n||null});error?alert(error.message):showPlatform()}
async function schAct(id,a){const r=a==='m'?await SB.rpc('extend_school',{sid:id,pl:'monthly'}):a==='a'?await SB.rpc('extend_school',{sid:id,pl:'annual'}):await SB.rpc('set_school_status',{sid:id,st:a==='on'?'active':'suspended'});r.error?alert(r.error.message):showPlatform()}
async function savePS(){const g=i=>document.getElementById(i).value.trim(),{error}=await SB.from('platform_settings').update({price_monthly:Math.max(0,Math.round(+g('tm')||0)),price_annual:Math.max(0,Math.round(+g('ta2')||0)),payment_instructions:g('ti')}).eq('id',true);document.getElementById('tx2').textContent=error?error.message:'Enregistré ✓'}

/* Parents (direction) */
async function showParents(){
 const[G,L,S,P]=await Promise.all([SB.from('guardians').select('*').order('last_name'),SB.from('student_guardians').select('student_id,guardian_id'),SB.from('students').select('id,first_name,last_name,classes(name)').order('last_name'),SB.from('profiles').select('person_id').eq('role','parent')]);
 const g=G.data||[],l=L.data||[],s=S.data||[],acc=new Set((P.data||[]).map(x=>x.person_id)),sm=Object.fromEntries(s.map(x=>[x.id,x]));
 B().innerHTML=`<div class="card"><h2>Ajouter un parent</h2><div class="row"><input id="gf" placeholder="Prénom"><input id="gl" placeholder="Nom"><input id="gp" placeholder="Téléphone" inputmode="tel"></div><p class="err" id="ge2"></p><button onclick="addGuardian()">Ajouter</button></div><p class="mut">${g.length} parent(s) · ${g.filter(x=>acc.has(x.id)).length} avec compte</p>`+
 (g.map(x=>{const ch=l.filter(y=>y.guardian_id===x.id).map(y=>sm[y.student_id]).filter(Boolean),free=s.filter(y=>!ch.some(c=>c.id===y.id));
  return `<div class="card"><div class="top"><b>${esc(nm(x))}</b><span class="mut">${acc.has(x.id)?'Compte actif':'Sans compte'}</span></div><div class="mut">${esc(x.phone||'—')}</div>${ch.map(c=>`<div class="li" style="justify-content:space-between;align-items:center"><span>${esc(nm(c))} <span class="mut">· ${esc(c.classes?.name||'sans classe')}</span></span><button class="ghost sm" onclick="unlink('${x.id}','${c.id}')">Retirer</button></div>`).join('')||'<div class="mut">Aucun enfant lié.</div>'}<div class="row"><select id="lk${x.id}"><option value="">Lier un élève…</option>${opt(free,y=>nm(y))}</select><button class="ghost" onclick="linkSt('${x.id}')">Lier</button></div></div>`}).join('')||'<p class="mut">Aucun parent.</p>');
}
async function addGuardian(){const g=i=>document.getElementById(i).value.trim();if(!g('gf')||!g('gl'))return document.getElementById('ge2').textContent='Prénom et nom obligatoires.';const{error}=await SB.from('guardians').insert({first_name:g('gf'),last_name:g('gl'),phone:g('gp')||null});error?document.getElementById('ge2').textContent=error.message:showParents()}
async function linkSt(gid){const v=document.getElementById('lk'+gid).value;if(!v)return;const{error}=await SB.from('student_guardians').insert({student_id:v,guardian_id:gid});error?alert(error.message):showParents()}
async function unlink(gid,sid){if(!confirm('Retirer ce lien parent-élève ?'))return;const{error}=await SB.from('student_guardians').delete().eq('student_id',sid).eq('guardian_id',gid);error?alert(error.message):showParents()}

async function addTeacher(){const g=i=>document.getElementById(i).value.trim(),x=document.getElementById('te2');
 if(!g('tf')||!g('tl'))return x.textContent='Prénom et nom obligatoires.';
 const{error}=await SB.from('teachers').insert({first_name:g('tf'),last_name:g('tl'),phone:g('tp')||null});
 error?x.textContent=error.message:showTeachers()}
async function delTeacher(id){if(!confirm('Supprimer ce professeur ? Ses matières resteront sans professeur.'))return;const{error}=await SB.from('teachers').delete().eq('id',id);error?alert(error.message):showTeachers()}

/* Paiements : déclaration, validation, relances, moyens de paiement */
const DM={bank:'Virement bancaire',orange_money:'Orange Money',orange_marchand:'Orange Marchand',mtn_money:'MTN Money',cash:'Espèces (remis à l’école)'},DST={pending:'En attente de validation',approved:'Validé',rejected:'Refusé'};
let PCFG={},FEI={};
async function loadCfg(){const{data}=await SB.from('school_payment_config').select('*').maybeSingle();PCFG=data||{};return PCFG}
async function declareHtml(cur){
 const[c,D]=await Promise.all([loadCfg(),SB.from('payment_declarations').select('*').eq('student_id',cur.id).order('created_at',{ascending:false})]);
 const L=[['Banque',[c.bank_name,c.bank_account_name,c.bank_account_number].filter(Boolean).join(' · ')],['Orange Money',c.orange_money_number],['Orange Marchand',c.orange_marchand_number],['MTN Money',c.mtn_money_number]].filter(x=>x[1]);
 return `<div class="card"><h2>Comment payer</h2>${L.map(([k,v])=>`<div class="li"><b>${k}</b><span>${esc(v)}</span></div>`).join('')||'<p class="mut">L’école n’a pas encore renseigné ses moyens de paiement.</p>'}${c.instructions?`<p style="white-space:pre-wrap;margin:8px 0">${esc(c.instructions)}</p>`:''}</div>
 <div class="card"><h2>Déclarer un paiement</h2><div class="row"><input id="da" type="number" min="1" placeholder="Montant payé (GNF)"><select id="dm">${Object.entries(DM).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div><input id="dr" placeholder="Référence de la transaction"><label class="mut">Reçu (photo ou PDF, 5 Mo max)</label><input id="df" type="file" accept="image/*,application/pdf"><p class="err" id="de"></p><button onclick="declarePay()">Envoyer pour validation</button></div>`+
 (D.data||[]).map(x=>`<div class="card"><b>${gnf(x.amount)}</b> · ${DM[x.method]}<div class="mut">${esc(new Date(x.created_at).toLocaleDateString('fr-FR'))} · ${DST[x.status]}${x.reference?' · réf. '+esc(x.reference):''}</div>${x.note?`<div class="mut">${esc(x.note)}</div>`:''}</div>`).join('');
}
async function declarePay(){
 const g=i=>document.getElementById(i),x=g('de'),a=Math.round(+g('da').value);
 if(!(a>0))return x.textContent='Indiquez le montant payé.';
 const f=g('df').files[0];let path=null;
 if(f){if(f.size>5242880)return x.textContent='Fichier trop lourd (5 Mo max).';
  path=`${CFG.id}/${me.id}/${Date.now()}-${f.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`;
  const u=await SB.storage.from('receipts').upload(path,f);if(u.error)return x.textContent='Envoi du reçu impossible : '+u.error.message}
 const{error}=await SB.from('payment_declarations').insert({student_id:FE.s,amount:a,method:g('dm').value,reference:g('dr').value.trim()||null,receipt_path:path});
 error?x.textContent=error.message:showFees()}
const cfgCard=c=>`<div class="card"><h2>Moyens de paiement de l’école</h2><input id="c1" placeholder="Banque" value="${esc(c.bank_name||'')}"><input id="c2" placeholder="Titulaire du compte" value="${esc(c.bank_account_name||'')}"><input id="c3" placeholder="Numéro de compte" value="${esc(c.bank_account_number||'')}"><input id="c4" placeholder="Numéro Orange Money" value="${esc(c.orange_money_number||'')}"><input id="c5" placeholder="Numéro Orange Marchand" value="${esc(c.orange_marchand_number||'')}"><input id="c6" placeholder="Numéro MTN Money" value="${esc(c.mtn_money_number||'')}"><textarea id="c7" rows="3" maxlength="1000" placeholder="Instructions de paiement">${esc(c.instructions||'')}</textarea><p class="err" id="c8"></p><button onclick="saveCfg()">Enregistrer</button></div>`;
async function reviewHtml(isA){
 const[D,c]=await Promise.all([SB.from('payment_declarations').select('*,students(first_name,last_name)').order('created_at',{ascending:false}).limit(40),loadCfg()]);
 const pe=(D.data||[]).filter(x=>x.status==='pending');
 return `<h2>Paiements déclarés à examiner (${pe.length})</h2>`+(pe.map(x=>`<div class="card"><b>${esc(nm(x.students))}</b><div>${gnf(x.amount)} · ${DM[x.method]}</div><div class="mut">${esc(new Date(x.created_at).toLocaleDateString('fr-FR'))}${x.reference?' · réf. '+esc(x.reference):''}</div>${x.receipt_path?`<button class="ghost sm" onclick="viewReceipt('${esc(x.receipt_path)}')">Voir le reçu</button>`:''}<div class="row"><button onclick="revDecl('${x.id}',true)">Valider</button><button class="ghost" onclick="revDecl('${x.id}',false)">Refuser</button></div></div>`).join('')||'<p class="mut">Aucune déclaration en attente.</p>')+(isA?cfgCard(c):'');
}
async function saveCfg(){const g=i=>document.getElementById(i).value.trim()||null;const{error}=await SB.from('school_payment_config').upsert({school_id:CFG.id,bank_name:g('c1'),bank_account_name:g('c2'),bank_account_number:g('c3'),orange_money_number:g('c4'),orange_marchand_number:g('c5'),mtn_money_number:g('c6'),instructions:g('c7'),updated_at:new Date().toISOString()});document.getElementById('c8').textContent=error?error.message:'Enregistré ✓'}
async function viewReceipt(p){const{data,error}=await SB.storage.from('receipts').createSignedUrl(p,120);error?alert(error.message):window.open(data.signedUrl,'_blank')}
async function revDecl(id,ok){const n=ok?null:prompt('Motif du refus (optionnel)');if(!ok&&n===null)return;const{error}=await SB.rpc('review_declaration',{did:id,ok,rnote:n||null});error?alert(error.message):showFees()}
async function remind(sid){const{data}=await SB.from('student_guardians').select('guardians(first_name,last_name,phone)').eq('student_id',sid);
 const g=(data||[]).map(x=>x.guardians).filter(x=>x&&x.phone);if(!g.length)return alert('Aucun parent avec un numéro de téléphone pour cet élève.');
 let p=g[0].phone.replace(/\D/g,'');if(p.length===9)p='224'+p;
 const i=FEI[sid],t=`Bonjour, rappel de ${CFG.school_name} : il reste ${gnf(i.r)} à régler pour ${i.n}. Merci de votre compréhension.`;
 await SB.from('fee_reminders').insert({student_id:sid});window.open(`https://wa.me/${p}?text=${encodeURIComponent(t)}`,'_blank')}
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
SB.auth.getSession().then(({data:{session}})=>session?load():authView());
</script></body></html>
